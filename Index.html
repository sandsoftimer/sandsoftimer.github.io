<!DOCTYPE html>
<html>
<head>
<title>Tabbed Content</title>
<style>
  body { font-family: sans-serif; text-align: center; } /* Center body text */

  /* Tab Container */
  .tab-container {
    overflow: hidden;
    border: 1px solid #ccc;
    background-color: #f1f1f1;
    margin-bottom: 20px;

  }

  /* Tab Buttons */
  .tab-button {
    background-color: inherit;
    float: left;
    border: none;
    outline: none;
    cursor: pointer;
    padding: 14px 16px;
    transition: 0.3s;
    font-size: 17px;
    margin: 0 5px;
  }

  .tab-button:hover {
    background-color: #ddd;
  }

  .tab-button.active {
    background-color: #007bff;
    color: white;
  }

  /* Tab Content */
  .tab-content {
    display: none; /* Hidden by default */
    padding: 20px;
    border: 1px solid #ccc;
    text-align: left; /* Content itself left-aligned within its box */
    max-width: 800px; /* Limit width for readability */
    margin: 0 auto; /* Center the content block */
  }

  .tab-content h2 {
    text-align: center; /* Center headings within the content */
  }
</style>
</head>
<body>

<!-- Tab Buttons -->
<div class="tab-container">
  <button class="tab-button" onclick="openTab(event, 'Home')">Home</button>
  <button class="tab-button" onclick="openTab(event, 'PrivacyPolicy')">Privacy Policy</button>
</div>

<!-- Tab Content -->
<div id="Home" class="tab-content">
  <h2>Welcome Alhostly!</h2>
</div>

<div id="PrivacyPolicy" class="tab-content">
  <h2>Our Privacy Policy</h2>
  <p>This section explains how we handle your data. All content is easily readable.</p>
  <p>We respect your privacy!</p
</div>

<script>
function openTab(evt, tabName) {
  var i, tabcontent, tablinks;
  // Get all elements with class="tab-content" and hide them
  tabcontent = document.getElementsByClassName("tab-content");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  // Get all elements with class="tab-button" and remove the active class
  tablinks = document.getElementsByClassName("tab-button");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }
  // Show the current tab, and add an "active" class to the button that opened the tab
  document.getElementById(tabName).style.display = "block";
  evt.currentTarget.className += " active";
}
// Open the first tab by default
document.getElementById("Home").style.display = "block";
document.querySelector(".tab-button").className += " active";
</script>

</body>
</html>
